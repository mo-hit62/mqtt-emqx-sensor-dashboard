<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MQTT Sensor Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 40px 25px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 36px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 16px;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 18px;
            border-radius: 20px;
            background: #064e3b;
            color: #34d399;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background: #1f2937;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            border: 1px solid #374151;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .card h2 {
            margin: 5px 0 20px;
            color: #d1d5db;
        }

        .value {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .unit {
            color: #9ca3af;
        }

        .info {
            margin-top: 30px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            color: #9ca3af;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>MQTT Sensor Dashboard</h1>

            <div class="subtitle">
                Real-Time IoT Sensor Monitoring
            </div>

            <div id="status" class="status">
                Connecting...
            </div>
        </header>


        <div class="cards">

            <div class="card">
                <div class="icon">🌡️</div>

                <h2>Temperature</h2>

                <div class="value" id="temperature">
                    -- °C
                </div>

                <div class="unit">
                    Live sensor reading
                </div>
            </div>


            <div class="card">
                <div class="icon">💧</div>

                <h2>Humidity</h2>

                <div class="value" id="humidity">
                    -- %
                </div>

                <div class="unit">
                    Live sensor reading
                </div>
            </div>

        </div>


        <div class="info">
            📡 Data is received in real time through MQTT over WebSocket
        </div>

    </div>


    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
